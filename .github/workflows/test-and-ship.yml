name: Test & Ship

on:
- push
- pull_request

env:
  MARIADB_ROOT_PASSWORD: root

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      COMPOSER_PROCESS_TIMEOUT: 0

    strategy:
      matrix:
        php_version:
          - 7.4

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php_version }}
        tools: composer:2
      env:
        COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Setup environment
      run: |
        set -e;

        cp .env.testing .env ;
        . .env ;
        . docker/utils.sh ;
        wait_for_mysql ;

        cat > $HOME/.my.cnf <<EOF
        [client]
        host=${DB_HOST}
        port=${DB_PORT}
        database=mysql
        user=root
        password=${MARIADB_ROOT_PASSWORD}
        EOF

        mysql -e "SELECT version();" ;
        mysql -e "SET GLOBAL sql_mode = 'ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION'" ;

    - name: Install dependencies
      run: |
        set -e ;

        composer install --no-interaction --prefer-dist

    - name: Check linting
      run: |
        set -e;

        composer lint

    - name: Prepare tests
      run: |
        set -e;

        composer pre-test;
        mysql -e 'SET @@GLOBAL.wait_timeout=1800';

    - name: Run tests
      run: |
        set -e;

        ( cd httpdocs/; php -S localhost:8000 -t . index.php &)
        composer test ;

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: ushahidi
          MARIADB_USER: ushahidi
          MARIADB_PASSWORD: ushahidi
          MARIADB_ROOT_PASSWORD: ${{ env.MARIADB_ROOT_PASSWORD }}
        ports:
        - 3306:3306
        options: --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s --health-timeout 5s
          --health-retries 60

  ship:
    needs: [ test ]
    if: github.event_name == 'push'   # not on PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: Workload Identity Federation to Google Cloud (no stored keys).
    # contents: write for the release tarball upload on version tags.
    permissions:
      id-token: write
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Artifact Registry in GCP: pushes as sa-platform-ci-push through the
    # foundation's Workload Identity pool.
    - name: Authenticate to Google Cloud (Workload Identity Federation)
      id: gcp-auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/384414633675/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
        service_account: sa-platform-ci-push@prj-c-shared-2uag.iam.gserviceaccount.com
        token_format: access_token

    - name: Login to Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: europe-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.gcp-auth.outputs.access_token }}

    # Artifact Registry tags are immutable: a branch build is tagged
    # <branch>-<sha> (no moving branch tag), a release with its version.
    - name: Docker meta (Artifact Registry)
      id: meta_gar
      uses: docker/metadata-action@v5
      with:
        images: |
          europe-docker.pkg.dev/prj-c-shared-2uag/platform/platform
        tags: |
          type=raw,value={{branch}}-{{sha}},enable=${{ github.ref_type == 'branch' }}
          type=ref,event=tag

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v3
      with:
        images: |
          ghcr.io/ushahidi/platform
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=sha

    - name: Build and push to GitHub and Artifact Registry
      uses: docker/build-push-action@v2
      with:
        pull: true
        push: ${{ github.event_name != 'pull_request' }}
        labels: ${{ steps.meta.outputs.labels }}
        tags: |
          ${{ steps.meta.outputs.tags }}
          ${{ steps.meta_gar.outputs.tags }}
        build-args: |
          GIT_COMMIT_ID=${{ github.sha }}
          GIT_BUILD_REF=${{ github.head_ref }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push release tar file
      uses: ./.github/actions/release-tar
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
